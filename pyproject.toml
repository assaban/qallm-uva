[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qallm-uva"
version = "0.2.0"
description = "Execution-Based Quality Assessment of AI-Generated Code in Jupyter Notebooks"
requires-python = ">=3.10"
dependencies = [
    "radon",
    "bandit",
    "ruff",
    "nbformat",
    "hypothesis",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-json-report",
    "coverage",
    "scipy",
    "openai",
    "anthropic",
    "ollama",
    "gitPython",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "httpx",
    "markdown",
]

[project.optional-dependencies]
# Install with: pip install -e ".[experiments]"
# Needed only for the HumanEvalFix validation experiment (qallm.experiments).
experiments = [
    "datasets>=2.18.0",
]
# Install with: pip install -e ".[jupyter]"
# Needed only for the %%qallm notebook magic (qallm.jupyter). Most notebook
# environments already provide ipython; this pins it for a clean install.
jupyter = [
    "ipython>=8.0",
]

[project.scripts]
qallm = "qallm.run_qallm:main"

[tool.pytest.ini_options]
# auto: async test functions are run by pytest-asyncio without each needing an
# explicit @pytest.mark.asyncio decorator. The async tests in tests/test_jobs.py
# and tests/test_api_jobs.py rely on this; under the default "strict" mode they
# would be skipped or errored, so this setting is required for them to run.
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
# qallm-demo-case is an intentional demonstration input with deliberate defects
# (it exists to be analysed, not to pass linting), so it is excluded from ruff.
extend-exclude = ["qallm-demo-case"]
