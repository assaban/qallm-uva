[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qallm-uva"
version = "0.2.0"
description = "Execution-Based Quality Assessment of AI-Generated Code in Jupyter Notebooks"
requires-python = ">=3.10"
dependencies = [
    "radon",
    "bandit",
    "ruff",
    "nbformat",
    "hypothesis",
    "pytest",
    "pytest-cov",
    "pytest-json-report",
    "coverage",
    "scipy",
    "openai",
    "anthropic",
    "ollama",
    "gitPython",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[project.scripts]
qallm = "qallm.run_qallm:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"