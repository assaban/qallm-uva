server {
    listen 80;
    server_name localhost; # Replace with your domain or VM IP if needed

    # Increase maximum upload size for project uploads
    client_max_body_size 100M;

    location / {
        proxy_pass http://qallm-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Required if FastAPI uses WebSockets for job streaming)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Prevent timeouts during long analysis runs
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}