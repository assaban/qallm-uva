# QALLM container stack.
#
# Default:                docker compose up           # API + SonarQube
# With local LLM:         docker compose --profile with-ollama up
# Rebuild after changes:  docker compose up --build
#
# SonarQube is part of the default stack (no flag). Ollama stays optional
# behind the with-ollama profile, since it is local compute you opt into.
#
# Configuration lives in .env. Copy .env.example to .env first and fill
# in at least one LLM API key (or use the ollama profile for local
# models with no external API key).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_SONAR_SCANNER: ${WITH_SONAR_SCANNER:-0}
    image: qallm:latest
    container_name: qallm-api
    # REMOVE OR COMMENT OUT THE OLD PUBLIC PORT MAPPING:
    # ports:
    #   - "${API_PORT:-8000}:8000"
    # USE EXPOSE INSTEAD (Keeps it internal to the Docker network)
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # SonarQube runs in this stack by default; point the api at it. Set
      # SONARQUBE_TOKEN in .env after generating one to activate analysis.
      - SONARQUBE_URL=${SONARQUBE_URL:-http://sonarqube:9000}
    volumes:
      - ./outputs:/home/qallm/app/outputs
      - ./uploads:/home/qallm/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # NEW REVERSE PROXY SERVICE
  reverse-proxy:
    image: nginx:alpine
    container_name: qallm-reverse-proxy
    ports:
      - "80:80"
      - "443:443" # <--- Add this line
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro # <--- Mount directory for SSL certificates
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

#   Optional local LLM. Skipped by default. Activate with:
#     docker compose --profile with-ollama up
#   Pulling models (e.g. gemma3:4b) is the user's responsibility:
#     docker compose exec ollama ollama pull gemma3:4b
#  ollama:
#    image: ollama/ollama:latest
#    container_name: qallm-ollama
#    profiles: ["with-ollama"]
#    ports:
#      - "${OLLAMA_PORT:-11434}:11434"
#    volumes:
#      - ollama-models:/root/.ollama
#    restart: unless-stopped

  # SonarQube server for higher-fidelity static analysis. Part of the
  # default stack (no profile flag): `docker compose up` starts it. On first
  # login open http://localhost:${SONARQUBE_PORT:-9000} (admin/admin),
  # generate a token, and set SONARQUBE_TOKEN in .env so the api picks it up.
  # SONARQUBE_URL defaults to the in-stack service (set on the api below).
  sonarqube:
    image: sonarqube:community
    container_name: qallm-sonarqube
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    environment:
      # Embedded H2 database: fine for local/single-node evaluation use,
      # which is QALLM's case. Not for production multi-node SonarQube.
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9000/api/system/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
#  ollama-models: