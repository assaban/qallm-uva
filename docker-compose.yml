# QALLM container stack.
#
# Default:                docker compose up           # API only
# With local LLM:         docker compose --profile with-ollama up
# Rebuild after changes:  docker compose up --build
#
# Configuration lives in .env. Copy .env.example to .env first and fill
# in at least one LLM API key (or use the ollama profile for local
# models with no external API key).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: qallm:latest
    container_name: qallm-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Default targets the in-stack ollama service (used with the
      # with-ollama profile). Override in .env if you run Ollama on
      # the host (set OLLAMA_BASE_URL=http://host.docker.internal:11434
      # on macOS/Windows) or anywhere else.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
#      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      # Mount outputs and uploads so reports survive container restarts.
      - ./outputs:/home/qallm/app/outputs
      - ./uploads:/home/qallm/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional local LLM. Skipped by default. Activate with:
  #   docker compose --profile with-ollama up
