# QALLM container stack.
#
# Default:                docker compose up           # API only
# With local LLM:         docker compose --profile with-ollama up
# With SonarQube:         docker compose --profile sonarqube up
# Rebuild after changes:  docker compose up --build
#
# Configuration lives in .env. Copy .env.example to .env first and fill
# in at least one LLM API key (or use the ollama profile for local
# models with no external API key).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: qallm:latest
    container_name: qallm-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Default targets the in-stack ollama service (used with the
      # with-ollama profile). Override in .env if you run Ollama on
      # the host (set OLLAMA_BASE_URL=http://host.docker.internal:11434
      # on macOS/Windows) or anywhere else.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
#      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      # Mount outputs and uploads so reports survive container restarts.
      - ./outputs:/home/qallm/app/outputs
      - ./uploads:/home/qallm/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

#   Optional local LLM. Skipped by default. Activate with:
#     docker compose --profile with-ollama up
#   Pulling models (e.g. gemma3:4b) is the user's responsibility:
#     docker compose exec ollama ollama pull gemma3:4b
#  ollama:
#    image: ollama/ollama:latest
#    container_name: qallm-ollama
#    profiles: ["with-ollama"]
#    ports:
#      - "${OLLAMA_PORT:-11434}:11434"
#    volumes:
#      - ollama-models:/root/.ollama
#    restart: unless-stopped

  # Optional SonarQube server for higher-fidelity static analysis. Skipped
  # by default; activate with:
  #     docker compose --profile sonarqube up
  # Then open http://localhost:${SONARQUBE_PORT:-9000} (admin/admin on
  # first login), generate a token, and set SONARQUBE_URL and
  # SONARQUBE_TOKEN in .env so the api service picks SonarQube up. When
  # both run in this stack, set SONARQUBE_URL=http://sonarqube:9000.
  sonarqube:
    image: sonarqube:community
    container_name: qallm-sonarqube
    profiles: ["sonarqube"]
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    environment:
      # Embedded H2 database: fine for local/single-node evaluation use,
      # which is QALLM's case. Not for production multi-node SonarQube.
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9000/api/system/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
#  ollama-models: